name: docker-ci

on:
  push:
    branches:
      - docker_cicd

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up QEMU (for multi-platform)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/mlops-major:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/mlops-major:${{ github.sha }}
          platforms: linux/amd64

      - name: Run smoke tests from image
        run: |
          echo "Running smoke test: executing test.py inside the built image"
          docker run --rm ${{ secrets.DOCKERHUB_USERNAME }}/mlops-major:latest python test.py
